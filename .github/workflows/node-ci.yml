name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  type-check:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: node .github/audit-gate.mjs

      - name: npm and JSR versions match
        run: npm run check:versions

      - name: Token sync check (tokens.css ↔ tokens.json ↔ index.ts)
        run: npm run check:sync

      - name: Contrast (every theme × season meets WCAG AA)
        run: npm run check:contrast

      - name: CSS contract (custom properties only, no url() beyond the pinned noise overlay)
        run: npm run check:css

      - name: Install Deno (the JSR runtime, for the entry-import test)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Check-script tests (including the built entry imported under Node and Deno)
        env:
          REQUIRE_DENO: '1'
        run: npm test

      - name: JSR dry run (type, slow-type and file checks; nothing is published)
        run: npx --no-install jsr publish --dry-run

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [p] = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))
            const files = p.files.map((f) => f.path).sort()
            const want = ['package.json', 'src/index.ts', 'src/seasons.css', 'src/tokens.css', 'src/tokens.json', 'LICENSE', 'README.md']
            for (const f of want) if (!files.includes(f)) { console.error('missing from the tarball:', f); process.exit(1) }
            const extra = files.filter((f) => !f.startsWith('src/') && !['package.json', 'LICENSE', 'README.md', 'CHANGELOG.md'].includes(f))
            if (extra.length) { console.error('unexpected files in the tarball:', extra); process.exit(1) }
            if (p.unpackedSize > 200_000) { console.error('tarball unpacked size', p.unpackedSize, 'exceeds 200 kB'); process.exit(1) }
          "
