name: Publish (npm)

# Publishes @meddleware/design-tokens to npmjs AND JSR on a v* tag. Publication
# is gated on a self-contained `verify` job (the same checks as CI: audit, versions, token sync, contrast,
# CSS contract, type-check, lint, package contents) that re-runs against the exact tagged commit, so a broken
# tag never ships. Both registries use OIDC — no long-lived secrets. npm and JSR publish in SEPARATE jobs,
# each with its own id-token, and the JSR CLI is the lockfile-pinned devDependency (never `npx jsr@latest`
# with the npm publisher's OIDC token in scope).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/node-ci.yml

  publish-npm:
    name: npmjs (@meddleware/design-tokens)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npmjs trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Publish to npmjs (OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          ENC=$(printf '%s' "$NAME" | sed 's#/#%2f#')
          # Check the registry directly — `npm view` can transiently miss a freshly
          # first-published version and then attempt a re-publish. A 200 means it's live.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${ENC}/${VERSION}")" = "200" ]; then
            echo "::notice::v${VERSION} already published to npmjs — skipping."
          else
            # Publish, but treat a "version already exists" error as success so a
            # manually-published version (or a registry race) leaves the job green.
            set +e; OUT=$(npm publish --provenance --access public 2>&1); RC=$?; set -e
            printf '%s\n' "$OUT"
            if [ "$RC" -ne 0 ]; then
              if printf '%s' "$OUT" | grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT'; then
                echo "::notice::v${VERSION} already published — treating as success."
              else
                exit "$RC"
              fi
            fi
          fi

  publish-jsr:
    name: JSR (@meddleware/design-tokens)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # JSR OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies (the JSR CLI is a pinned devDependency)
        run: npm ci
      - name: Publish to JSR (OIDC, idempotent)
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if curl -sf "https://api.jsr.io/scopes/meddleware/packages/design-tokens/versions/${VERSION}" > /dev/null; then
            echo "::notice::v${VERSION} already published to JSR — skipping"
          else
            npx --no-install jsr publish
          fi
